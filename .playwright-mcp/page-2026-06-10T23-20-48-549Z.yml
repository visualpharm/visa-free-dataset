              - text: on GitHub (originally ilyankou/passport-index-dataset; this site uses our maintained fork with consular updates through May 2026). For every ordered pair (passport country, destination country), the dataset records the access category. We re-verify any consequential change against the issuing country's foreign ministry or embassy site before applying it.
