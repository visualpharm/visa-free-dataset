      - list [ref=e24]:
        - listitem [ref=e25]:
          - generic [ref=e26]:
            - generic [ref=e27]: "01"
            - heading "The formula, in one line." [level=2] [ref=e28]
            - paragraph [ref=e29]:
              - text: For every passport
              - strong [ref=e30]: p
              - text: ", we compute:"
              - strong [ref=e31]: score(p) = Σ visitors(d)
              - text: over every destination
              - strong [ref=e32]: d
              - text: that
              - strong [ref=e33]: p
              - text: "'s citizens can enter visa-free, on visa-on-arrival, with an electronic travel authorization, or under a numeric-day stay agreement. We do"
              - emphasis [ref=e34]: not
              - text: divide by population. We do
              - emphasis [ref=e35]: not
              - text: count destinations. The score is in
              - strong [ref=e36]: millions of annual visitors of accessible world
              - text: .
        - listitem [ref=e37]:
          - generic [ref=e38]:
            - generic [ref=e39]: "02"
            - heading "What counts as \"open access\"." [level=2] [ref=e40]:
              - text: What counts as
              - emphasis [ref=e41]: "\"open access\"."
            - paragraph [ref=e42]:
              - text: "A destination is \"accessible\" to a passport-holder if they can arrive without applying for a visa beforehand. That covers four categories from the source dataset:"
              - strong [ref=e43]: visa-free
              - text: ","
              - strong [ref=e44]: visa-on-arrival
              - text: ","
              - strong [ref=e45]: ETA
              - text: (electronic travel authorization, e.g. Australia, Sri Lanka), and
              - strong [ref=e46]: numeric-day stay agreements
              - text: (e.g. "30 days" or "90 days" without a separate visa). E-visas
              - emphasis [ref=e47]: do not
              - text: count – an e-visa is still a visa application, just submitted online instead of at an embassy. Each citizen also has access to their own home country, included in the sum.
        - listitem [ref=e48]:
          - generic [ref=e49]:
            - generic [ref=e50]: "03"
            - heading "Where the visitor numbers come from." [level=2] [ref=e51]
            - paragraph [ref=e52]:
              - text: Annual international tourist arrivals are pulled from the
              - strong [ref=e53]: UN World Tourism Organization (UNWTO)
              - text: database and supplemented with national tourism-board figures for countries UNWTO publishes infrequently. Each destination has a single
              - strong [ref=e54]: visitors-per-year
              - text: number in millions. The dataset covers
              - strong [ref=e55]: 199 destinations
              - text: – every country and territory listed in the source passport-index dataset – including small island states, partial recognitions, and self-governing territories.
        - listitem [ref=e56]:
          - generic [ref=e57]:
            - generic [ref=e58]: "04"
            - heading "Where the visa rules come from." [level=2] [ref=e59]
            - paragraph [ref=e60]:
              - text: The bilateral access matrix comes from the open-source
              - strong [ref=e61]: passport-index-dataset
              - text: on GitHub (originally ilyankou/passport-index-dataset; this site uses our maintained fork with consular updates through June 2026). For every ordered pair (passport country, destination country), the dataset records the access category. We re-verify any consequential change against the issuing country's foreign ministry or embassy site before applying it.
        - listitem [ref=e62]:
          - generic [ref=e63]:
            - generic [ref=e64]: "05"
            - heading "Two things we deliberately don't do." [level=2] [ref=e65]:
              - text: Two things we deliberately
              - emphasis [ref=e66]: don't do.
            - paragraph [ref=e67]:
              - strong [ref=e68]: We do not divide by population.
              - text: Per-capita rankings make microstates win for arithmetic reasons – Andorra (80,000 people) topping a list of passports felt absurd, and was.
              - strong [ref=e69]: We do not count countries.
              - text: Counting destinations treats Tuvalu (1,000 visitors a year) as equivalent to France (100 million). The whole point of this index is that those two unlocks are not the same; ranking by visitor flow says so honestly.
        - listitem [ref=e70]:
          - generic [ref=e71]:
            - generic [ref=e72]: "06"
            - heading "How ties are handled." [level=2] [ref=e73]
            - paragraph [ref=e74]:
              - text: "Many passports score within a million arrivals of each other – the EU Schengen states are a good example. Where two or more passports tie at a given score, they share a rank: the table renders the rank number once, on the first row of the tied group, and leaves it blank on the rows beneath until the next rank starts. No"
              - strong [ref=e75]: =
              - text: glyph, no
              - strong [ref=e76]: ×N
              - text: badge – just a quietly shared number. As you scroll through a large tied group, the rank pins to the top of the table so the group's identity stays visible.
