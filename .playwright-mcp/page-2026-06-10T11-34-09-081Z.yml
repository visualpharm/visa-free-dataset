            - emphasis [ref=e18]: flow
            - text: they unlock, not the countries they list.
          - paragraph [ref=e19]: The Open Door Index assigns every passport a score equal to the sum of annual tourist arrivals at every destination its citizens can enter without applying for a visa in advance. A passport that opens France (100M visitors a year) outscores one that opens Tuvalu (1,000 visitors). Every number on this site is a tourist-arrivals figure – never a country count.
