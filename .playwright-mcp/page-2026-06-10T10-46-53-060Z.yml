        - generic [ref=e13]: The Open Door Index · 2026
        - heading "A passport ranking that measures where you can want to go." [level=1] [ref=e14]:
          - text: A passport ranking that measures
          - generic [ref=e16]: where you can
          - emphasis [ref=e17]: want to go.
        - paragraph [ref=e18]: Traditional rankings count visa-free countries. This one weights each destination by its annual tourism volume – so a passport that opens France (100M visitors a year) outscores one that opens a quieter country with the same number of stamps.
        - generic [ref=e19]:
          - link "Methodology →" [ref=e20] [cursor=pointer]:
            - /url: /passport-insights/methodology
          - generic [ref=e21]: ·
          - link "Key findings →" [ref=e22] [cursor=pointer]:
