        - generic [ref=e23]:
          - generic [ref=e24]:
            - term [ref=e25]: Strongest passport
            - definition [ref=e26]:
              - generic [ref=e27]: 🇰🇷
              - generic [ref=e28]: South Korea
            - generic [ref=e29]: "Unlocks 1.4 billion tourists' worth of world. Honestly, the top ten is a tie between rich East Asia and the Nordics – same metric, same lifestyle, same passport: small countries that quietly out-travel everyone."
          - generic [ref=e30]:
            - term [ref=e31]: Most welcoming
            - definition [ref=e32]:
              - generic [ref=e33]: 🇲🇻
              - generic [ref=e34]: Maldives
            - generic [ref=e35]: Lets in nearly every nationality on Earth without a pre-issued visa. The richest tourist destination that holds the door open for everyone, not just the wealthy West.
            - generic [ref=e36]: "Runners-up: 🇷🇼 Rwanda · 🇰🇪 Kenya"
          - generic [ref=e37]:
            - term [ref=e38]: Weakest passport
            - definition [ref=e39]:
              - generic [ref=e40]: 🇦🇫
              - generic [ref=e41]: Afghanistan
            - generic [ref=e42]: Reaches just 26 countries without paperwork – and those 26 host only 48M tourists a year, 30× less than the top passport. The world is mostly closed.
            - generic [ref=e43]: "Runners-up: 🇸🇾 Syria · 🇮🇶 Iraq"
          - generic [ref=e44]:
            - term [ref=e45]: Most overlooked
            - definition [ref=e46]:
              - generic [ref=e47]: 🇧🇮
              - generic [ref=e48]: Burundi
            - generic [ref=e49]: Open to almost every passport on Earth – and almost nobody comes. About 50K visitors a year, against 100M for France. Easy to enter, rarely visited.
            - generic [ref=e50]: "Runners-up: 🇰🇲 Comoros · 🇫🇲 Micronesia"
          - generic [ref=e51]:
            - term [ref=e52]: One-way passport
            - definition [ref=e53]:
              - generic [ref=e54]: 🇺🇸
              - generic [ref=e55]: United States
            - generic [ref=e56]: Americans walk into 160 countries without a visa. The U.S. itself lets in just 46 nationalities the same way – the widest one-way street in passport diplomacy.
            - generic [ref=e57]: "Runners-up: 🇦🇺 Australia · 🇨🇦 Canada"
          - generic [ref=e58]:
            - term [ref=e59]: Biggest 2026 shift
            - definition [ref=e60]:
              - generic [ref=e61]: 🇨🇳
              - generic [ref=e62]: China ↑
            - generic [ref=e63]: Quietly opened visa-free travel to seven new countries this year – UK, Canada, and five Gulf states. Roughly 455M tourist-arrivals' worth of new mobility, the largest single expansion of 2026.
            - generic [ref=e64]:
              - text: "Also opening:"
              - generic [ref=e65]: 🇮🇳 India ↑
              - text: "· Also closing:"
              - generic [ref=e66]: 🇳🇦 Namibia ↓
