      - generic [ref=e29]:
        - generic [ref=e30]:
          - term [ref=e31]: Strongest passport
          - definition [ref=e32]:
            - generic [ref=e33]: 🇰🇷
            - generic [ref=e34]: South Korea
          - generic [ref=e35]: "Unlocks 1.4 billion tourists' worth of world. Honestly, the top ten is a tie between rich East Asia and the Nordics – same metric, same lifestyle, same passport: small countries that quietly out-travel everyone."
        - generic [ref=e36]:
          - term [ref=e37]: Most welcoming
          - definition [ref=e38]:
            - generic [ref=e39]: 🇲🇻
            - generic [ref=e40]: Maldives
          - generic [ref=e41]: Lets in nearly every nationality on Earth without a pre-issued visa. The richest tourist destination that holds the door open for everyone, not just the wealthy West.
          - generic [ref=e42]: "Runners-up: 🇷🇼 Rwanda · 🇰🇪 Kenya"
        - generic [ref=e43]:
          - term [ref=e44]: Weakest passport
          - definition [ref=e45]:
            - generic [ref=e46]: 🇦🇫
            - generic [ref=e47]: Afghanistan
          - generic [ref=e48]: Reaches just 26 countries without paperwork – and those 26 host only 48M tourists a year, 30× less than the top passport. The world is mostly closed.
          - generic [ref=e49]: "Runners-up: 🇸🇾 Syria · 🇮🇶 Iraq"
        - generic [ref=e50]:
          - term [ref=e51]: Most overlooked
          - definition [ref=e52]:
            - generic [ref=e53]: 🇧🇮
            - generic [ref=e54]: Burundi
          - generic [ref=e55]: Open to almost every passport on Earth – and almost nobody comes. About 50K visitors a year, against 100M for France. Easy to enter, rarely visited.
          - generic [ref=e56]: "Runners-up: 🇰🇲 Comoros · 🇫🇲 Micronesia"
        - generic [ref=e57]:
          - term [ref=e58]: One-way passport
          - definition [ref=e59]:
            - generic [ref=e60]: 🇺🇸
            - generic [ref=e61]: United States
          - generic [ref=e62]: Americans walk into 160 countries without a visa. The U.S. itself lets in just 46 nationalities the same way – the widest one-way street in passport diplomacy.
          - generic [ref=e63]: "Runners-up: 🇦🇺 Australia · 🇨🇦 Canada"
        - generic [ref=e64]:
          - term [ref=e65]: Biggest 2026 shift
          - definition [ref=e66]:
            - generic [ref=e67]: 🇨🇳
            - generic [ref=e68]: China ↑
          - generic [ref=e69]: Quietly opened visa-free travel to seven new countries this year – UK, Canada, and five Gulf states. Roughly 455M tourist-arrivals' worth of new mobility, the largest single expansion of 2026.
