      - heading "A passport ranking that measures where you can want to go." [level=1] [ref=e20]:
        - text: A passport ranking that measures
        - generic [ref=e22]: where you can
        - emphasis [ref=e23]: want to go.
      - paragraph [ref=e24]: Traditional rankings count visa-free countries. This one weights each destination by its annual tourism volume – so a passport that opens France (100M visitors a year) outscores one that opens a quieter country with the same number of stamps.
